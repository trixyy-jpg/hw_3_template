services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-8080}:8000"
    environment:
      PORT: "8000"
      GREETING: "${GREETING:-Hello from HSE Docker!}"
      STORAGE: sqlite
      DATA_FILE: /data/counter.db
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
